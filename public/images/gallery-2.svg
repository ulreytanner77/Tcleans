<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="g2Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="100%" stop-color="#2a2015"/>
    </linearGradient>
    <linearGradient id="g2Tap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b6914"/>
      <stop offset="100%" stop-color="#3d2e1a"/>
    </linearGradient>
    <linearGradient id="g2TapHandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="50%" stop-color="#c9942e"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <radialGradient id="g2Glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#c9942e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a1510" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g2Beer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e6c8" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#d4a843" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c9942e" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g2Bg)"/>
  <rect width="800" height="600" fill="url(#g2Glow)"/>
  <!-- Tap wall backdrop -->
  <rect x="50" y="50" width="700" height="350" rx="4" fill="#2a2015" opacity="0.6"/>
  <!-- Beer tap row -->
  <!-- Tap 1 -->
  <rect x="120" y="120" width="8" height="80" rx="2" fill="url(#g2TapHandle)" opacity="0.7"/>
  <rect x="112" y="105" width="24" height="20" rx="6" fill="#d4a843" opacity="0.5"/>
  <circle cx="124" cy="200" r="6" fill="#8b6914" opacity="0.5"/>
  <!-- Tap 2 -->
  <rect x="230" y="110" width="8" height="90" rx="2" fill="url(#g2TapHandle)" opacity="0.6"/>
  <rect x="222" y="95" width="24" height="20" rx="6" fill="#c9942e" opacity="0.5"/>
  <circle cx="234" cy="200" r="6" fill="#8b6914" opacity="0.5"/>
  <!-- Tap 3 -->
  <rect x="340" y="115" width="8" height="85" rx="2" fill="url(#g2TapHandle)" opacity="0.7"/>
  <rect x="332" y="100" width="24" height="20" rx="6" fill="#d4a843" opacity="0.45"/>
  <circle cx="344" cy="200" r="6" fill="#8b6914" opacity="0.5"/>
  <!-- Tap 4 -->
  <rect x="450" y="108" width="8" height="92" rx="2" fill="url(#g2TapHandle)" opacity="0.65"/>
  <rect x="442" y="93" width="24" height="20" rx="6" fill="#c9942e" opacity="0.5"/>
  <circle cx="454" cy="200" r="6" fill="#8b6914" opacity="0.5"/>
  <!-- Tap 5 -->
  <rect x="560" y="118" width="8" height="82" rx="2" fill="url(#g2TapHandle)" opacity="0.7"/>
  <rect x="552" y="103" width="24" height="20" rx="6" fill="#d4a843" opacity="0.5"/>
  <circle cx="564" cy="200" r="6" fill="#8b6914" opacity="0.5"/>
  <!-- Tap 6 -->
  <rect x="670" y="112" width="8" height="88" rx="2" fill="url(#g2TapHandle)" opacity="0.6"/>
  <rect x="662" y="97" width="24" height="20" rx="6" fill="#c9942e" opacity="0.45"/>
  <circle cx="674" cy="200" r="6" fill="#8b6914" opacity="0.5"/>
  <!-- Tap base rail -->
  <rect x="80" y="200" width="640" height="6" rx="3" fill="#8b6914" opacity="0.3"/>
  <!-- Drip tray -->
  <rect x="80" y="210" width="640" height="20" rx="2" fill="#3d2e1a" opacity="0.4"/>
  <!-- Pint glass suggestion -->
  <path d="M350,350 L360,480 L420,480 L430,350 Z" fill="url(#g2Beer)" opacity="0.4"/>
  <rect x="355" y="345" width="70" height="8" rx="2" fill="#f5e6c8" opacity="0.15"/>
  <!-- Second glass -->
  <path d="M500,360 L508,475 L558,475 L566,360 Z" fill="url(#g2Beer)" opacity="0.3"/>
  <rect x="504" y="355" width="58" height="7" rx="2" fill="#f5e6c8" opacity="0.12"/>
  <!-- Counter surface -->
  <rect x="0" y="500" width="800" height="100" fill="#3d2e1a" opacity="0.4"/>
  <rect x="0" y="498" width="800" height="4" fill="#8b6914" opacity="0.15"/>
