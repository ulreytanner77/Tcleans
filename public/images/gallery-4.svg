  <rect x="500" y="392" width="14" height="24" rx="3" fill="#c9942e" opacity="0.12"/>
  <!-- Warm overhead string lights -->
  <line x1="50" y1="80" x2="750" y2="100" stroke="#8b6914" stroke-width="1" opacity="0.2"/>
  <circle cx="150" cy="83" r="6" fill="#d4a843" opacity="0.25"/>
  <circle cx="300" cy="88" r="5" fill="#c9942e" opacity="0.2"/>
  <circle cx="450" cy="92" r="6" fill="#d4a843" opacity="0.25"/>
  <circle cx="600" cy="96" r="5" fill="#c9942e" opacity="0.2"/>
  <!-- Second string -->
  <line x1="100" y1="130" x2="700" y2="145" stroke="#8b6914" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="133" r="5" fill="#d4a843" opacity="0.2"/>
  <circle cx="375" cy="138" r="6" fill="#c9942e" opacity="0.22"/>
