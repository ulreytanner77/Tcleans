<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="g4Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="100%" stop-color="#2a2015"/>
    </linearGradient>
    <radialGradient id="g4Glow1" cx="250" cy="200" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g4Glow2" cx="550" cy="250" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c9942e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c9942e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g4Bg)"/>
  <rect width="800" height="600" fill="url(#g4Glow1)"/>
  <rect width="800" height="600" fill="url(#g4Glow2)"/>
  <!-- Table/gathering area -->
  <ellipse cx="400" cy="420" rx="300" ry="100" fill="#3d2e1a" opacity="0.35"/>
  <ellipse cx="400" cy="418" rx="300" ry="98" fill="none" stroke="#8b6914" stroke-width="1.5" opacity="0.12"/>
  <!-- People silhouettes - abstract rounded shapes suggesting a group -->
  <!-- Person 1 -->
  <circle cx="200" cy="260" r="25" fill="#3d2e1a" opacity="0.5"/>
