<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="g6Sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2015"/>
      <stop offset="40%" stop-color="#3d2e1a"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
    <radialGradient id="g6Moon" cx="650" cy="100" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5e6c8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#d4a843" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g6Patio" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d2e1a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2a2015" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="g6Light1" cx="200" cy="250" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d4a843" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g6Light2" cx="600" cy="250" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c9942e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c9942e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g6Sky)"/>
  <!-- Moon/evening sky -->
  <rect width="800" height="600" fill="url(#g6Moon)"/>
  <circle cx="650" cy="100" r="30" fill="#f5e6c8" opacity="0.15"/>
  <circle cx="650" cy="100" r="25" fill="#f5e6c8" opacity="0.08"/>
  <!-- Stars -->
  <circle cx="100" cy="60" r="2" fill="#f5e6c8" opacity="0.15"/>
  <circle cx="250" cy="40" r="1.5" fill="#f5e6c8" opacity="0.12"/>
  <circle cx="400" cy="55" r="2" fill="#f5e6c8" opacity="0.1"/>
  <circle cx="500" cy="30" r="1.5" fill="#f5e6c8" opacity="0.13"/>
  <circle cx="350" cy="80" r="1" fill="#f5e6c8" opacity="0.1"/>
  <circle cx="150" cy="110" r="1.5" fill="#f5e6c8" opacity="0.08"/>
  <circle cx="550" cy="70" r="1" fill="#f5e6c8" opacity="0.1"/>
  <!-- String lights across patio -->
  <path d="M0,180 Q200,210 400,185 Q600,160 800,190" fill="none" stroke="#8b6914" stroke-width="1.5" opacity="0.25"/>
  <circle cx="100" cy="192" r="5" fill="#d4a843" opacity="0.35"/>
  <circle cx="200" cy="200" r="6" fill="#f5e6c8" opacity="0.3"/>
  <circle cx="300" cy="195" r="5" fill="#d4a843" opacity="0.35"/>
  <circle cx="400" cy="186" r="6" fill="#f5e6c8" opacity="0.3"/>
  <circle cx="500" cy="178" r="5" fill="#d4a843" opacity="0.35"/>
  <circle cx="600" cy="175" r="6" fill="#f5e6c8" opacity="0.3"/>
  <circle cx="700" cy="182" r="5" fill="#d4a843" opacity="0.35"/>
  <!-- Light glows -->
  <rect width="800" height="600" fill="url(#g6Light1)"/>
  <rect width="800" height="600" fill="url(#g6Light2)"/>
  <!-- Patio floor -->
  <rect x="0" y="400" width="800" height="200" fill="url(#g6Patio)"/>
  <rect x="0" y="398" width="800" height="4" fill="#8b6914" opacity="0.1"/>
  <!-- Patio pavers - subtle grid -->
  <line x1="0" y1="450" x2="800" y2="450" stroke="#8b6914" stroke-width="0.5" opacity="0.06"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#8b6914" stroke-width="0.5" opacity="0.05"/>
  <line x1="0" y1="550" x2="800" y2="550" stroke="#8b6914" stroke-width="0.5" opacity="0.04"/>
  <line x1="200" y1="400" x2="200" y2="600" stroke="#8b6914" stroke-width="0.5" opacity="0.05"/>
  <line x1="400" y1="400" x2="400" y2="600" stroke="#8b6914" stroke-width="0.5" opacity="0.05"/>
  <line x1="600" y1="400" x2="600" y2="600" stroke="#8b6914" stroke-width="0.5" opacity="0.05"/>
  <!-- Patio table left -->
  <ellipse cx="200" cy="430" rx="70" ry="30" fill="#3d2e1a" opacity="0.5"/>
  <ellipse cx="200" cy="428" rx="70" ry="30" fill="none" stroke="#8b6914" stroke-width="1" opacity="0.1"/>
  <!-- Chair suggestions -->
  <rect x="130" y="440" width="25" height="30" rx="4" fill="#2a2015" opacity="0.35"/>
  <rect x="245" y="440" width="25" height="30" rx="4" fill="#2a2015" opacity="0.35"/>
  <!-- Patio table right -->
  <ellipse cx="600" cy="440" rx="70" ry="30" fill="#3d2e1a" opacity="0.5"/>
  <ellipse cx="600" cy="438" rx="70" ry="30" fill="none" stroke="#8b6914" stroke-width="1" opacity="0.1"/>
  <rect x="530" y="450" width="25" height="30" rx="4" fill="#2a2015" opacity="0.35"/>
  <rect x="645" y="450" width="25" height="30" rx="4" fill="#2a2015" opacity="0.35"/>
  <!-- Plant/greenery accent (dark toned) -->
  <ellipse cx="50" cy="350" rx="40" ry="60" fill="#2a2015" opacity="0.5"/>
  <ellipse cx="750" cy="360" rx="45" ry="55" fill="#2a2015" opacity="0.45"/>
  <!-- Candle on table -->
  <rect x="195" y="415" width="10" height="15" rx="2" fill="#c9942e" opacity="0.15"/>
  <ellipse cx="200" cy="413" rx="4" ry="3" fill="#d4a843" opacity="0.3"/>
  <rect x="595" y="425" width="10" height="15" rx="2" fill="#c9942e" opacity="0.15"/>
  <ellipse cx="600" cy="423" rx="4" ry="3" fill="#d4a843" opacity="0.3"/>
</svg>