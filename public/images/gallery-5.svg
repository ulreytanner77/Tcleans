<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="g5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="50%" stop-color="#2a2015"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
    <radialGradient id="g5Spotlight" cx="400" cy="180" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1a1510" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g5Shaker" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e6c8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#d4a843" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b6914" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#g5Bg)"/>
  <rect width="800" height="600" fill="url(#g5Spotlight)"/>
  <!-- Bar back shelves with bottles -->
  <rect x="50" y="30" width="700" height="280" fill="#2a2015" opacity="0.4"/>
  <!-- Shelves -->
  <rect x="80" y="100" width="640" height="3" fill="#8b6914" opacity="0.2"/>
  <rect x="80" y="190" width="640" height="3" fill="#8b6914" opacity="0.18"/>
  <rect x="80" y="280" width="640" height="3" fill="#8b6914" opacity="0.15"/>
  <!-- Back bar bottles - row 1 -->
  <rect x="120" y="50" width="18" height="45" rx="4" fill="#3d2e1a" opacity="0.5"/>
  <rect x="155" y="55" width="16" height="40" rx="3" fill="#c9942e" opacity="0.12"/>
  <rect x="190" y="48" width="18" height="47" rx="4" fill="#3d2e1a" opacity="0.45"/>
  <rect x="260" y="52" width="16" height="43" rx="4" fill="#d4a843" opacity="0.1"/>
  <rect x="300" y="46" width="20" height="49" rx="4" fill="#3d2e1a" opacity="0.5"/>
  <rect x="400" y="50" width="18" height="45" rx="4" fill="#c9942e" opacity="0.1"/>
  <rect x="450" y="54" width="16" height="41" rx="3" fill="#3d2e1a" opacity="0.45"/>
  <rect x="520" y="48" width="18" height="47" rx="4" fill="#d4a843" opacity="0.12"/>
  <rect x="580" y="52" width="16" height="43" rx="4" fill="#3d2e1a" opacity="0.5"/>
  <rect x="640" y="50" width="18" height="45" rx="3" fill="#c9942e" opacity="0.1"/>
  <!-- Bartender silhouette - abstract figure -->
  <circle cx="400" cy="200" r="35" fill="#2a2015" opacity="0.6"/>
  <ellipse cx="400" cy="300" rx="45" ry="70" fill="#2a2015" opacity="0.55"/>
  <!-- Arms extended - pouring gesture -->
  <ellipse cx="340" cy="280" rx="40" ry="12" fill="#2a2015" opacity="0.45" transform="rotate(-15 340 280)"/>
  <ellipse cx="470" cy="270" rx="35" ry="12" fill="#2a2015" opacity="0.45" transform="rotate(20 470 270)"/>
  <!-- Cocktail shaker in hand -->
  <rect x="470" y="240" width="20" height="50" rx="5" fill="url(#g5Shaker)"/>
  <rect x="472" y="235" width="16" height="8" rx="3" fill="#f5e6c8" opacity="0.12"/>
  <!-- Bar counter -->
  <rect x="0" y="380" width="800" height="10" fill="#3d2e1a" opacity="0.6"/>
  <rect x="0" y="378" width="800" height="4" rx="1" fill="#8b6914" opacity="0.15"/>
  <rect x="0" y="390" width="800" height="210" fill="#2a2015" opacity="0.4"/>
  <!-- Glasses on bar -->
  <path d="M200,360 L205,378 L235,378 L240,360 Z" fill="#d4a843" opacity="0.1"/>
  <path d="M560,355 L565,378 L590,378 L595,355 Z" fill="#c9942e" opacity="0.12"/>
  <!-- Coupe glass -->
  <ellipse cx="320" cy="355" rx="22" ry="10" fill="#d4a843" opacity="0.08"/>
  <rect x="318" y="362" width="4" height="16" fill="#d4a843" opacity="0.06"/>
  <rect x="310" y="376" width="20" height="2" rx="1" fill="#d4a843" opacity="0.06"/>
  <!-- Warm light accent -->
  <ellipse cx="400" cy="100" rx="100" ry="20" fill="#c9942e" opacity="0.06"/>
</svg>