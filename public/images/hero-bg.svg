<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="40%" stop-color="#2a2015"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
    <radialGradient id="heroGlow1" cx="30%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#c9942e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a1510" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlow2" cx="70%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#d4a843" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1a1510" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlow3" cx="50%" cy="80%" r="30%">
      <stop offset="0%" stop-color="#8b6914" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1a1510" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9942e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9942e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c9942e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#heroBg)"/>
  <rect width="1920" height="1080" fill="url(#heroGlow1)"/>
  <rect width="1920" height="1080" fill="url(#heroGlow2)"/>
  <rect width="1920" height="1080" fill="url(#heroGlow3)"/>
  <!-- Subtle horizontal lines suggesting a bar atmosphere -->
  <rect x="0" y="350" width="1920" height="1" fill="url(#heroLine)"/>
  <rect x="0" y="700" width="1920" height="1" fill="url(#heroLine)"/>
  <!-- Warm ambient circles -->
  <circle cx="300" cy="400" r="120" fill="#c9942e" opacity="0.04"/>
  <circle cx="1600" cy="300" r="180" fill="#d4a843" opacity="0.03"/>
  <circle cx="960" cy="600" r="250" fill="#8b6914" opacity="0.03"/>
  <circle cx="500" cy="800" r="100" fill="#c9942e" opacity="0.05"/>
  <circle cx="1400" cy="750" r="150" fill="#d4a843" opacity="0.04"/>
  <!-- Subtle diamond shapes -->
  <polygon points="960,200 1010,270 960,340 910,270" fill="#c9942e" opacity="0.06"/>
  <polygon points="400,500 430,545 400,590 370,545" fill="#d4a843" opacity="0.05"/>
  <polygon points="1500,450 1530,495 1500,540 1470,495" fill="#8b6914" opacity="0.05"/>
  <!-- Bottom fade -->
  <rect x="0" y="900" width="1920" height="180" fill="url(#heroBg)" opacity="0.5"/>
</svg>